# ==============================================================================
# SMART LOCKER ENTERPRISE - EMQX TOPIC-LEVEL ACCESS CONTROL LIST (ACL)
# Tuân thủ tiêu chuẩn an ninh thông tin NIST IoT & OWASP IoT Top 10
# ==============================================================================

# 1. Cloud Backend Service (Full Pub/Sub on ptit/smartlocker/#)
{allow, {client, "^smart_locker_backend_.*"}, all, ["ptit/smartlocker/#"]}.
{allow, {user, "backend_admin"}, all, ["ptit/smartlocker/#"]}.

# 2. Edge Kiosk Hardware (Strict Locker Isolation)
{allow, {client, "^locker_([a-zA-Z0-9_-]+)$"}, subscribe, [
    "ptit/smartlocker/%c/command/#",
    "ptit/smartlocker/%c/state"
]}.

{allow, {client, "^locker_([a-zA-Z0-9_-]+)$"}, publish, [
    "ptit/smartlocker/%c/heartbeat",
    "ptit/smartlocker/%c/event",
    "ptit/smartlocker/%c/command/ack",
    "ptit/smartlocker/%c/status",
    "ptit/smartlocker/%c/state"
]}.

# 3. Auditor & Test Clients (MQTTX)
{allow, {client, "^mqttx_.*"}, subscribe, ["ptit/smartlocker/#"]}.
{allow, {client, "^mqttx_.*"}, publish, ["ptit/smartlocker/+/heartbeat", "ptit/smartlocker/+/event", "ptit/smartlocker/+/command/ack"]}.

# 4. Deny-all fallback
{deny, all}.
