# ==============================================================================
# SMART LOCKER ENTERPRISE - EMQX TOPIC-LEVEL ACCESS CONTROL LIST (ACL)
# Tuân thủ tiêu chuẩn an ninh thông tin NIST IoT & OWASP IoT Top 10
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. QUYỀN HẠN CỦA CLOUD BACKEND SERVICE (Super Admin Service)
# Định danh qua Client ID bắt đầu bằng: smart_locker_backend_* hoặc Username: backend_admin
# Cho phép Publish / Subscribe toàn bộ không gian topic của hệ thống tủ.
# ------------------------------------------------------------------------------
{allow, {client, "^smart_locker_backend_.*"}, all, ["ptit/#"]}.
{allow, {user, "backend_admin"}, all, ["ptit/#"]}.

# ------------------------------------------------------------------------------
# 2. QUYỀN HẠN CỦA TRẠM TỦ KIOSK / ESP32 HARDWARE
# ESP32 đăng ký lắng nghe lệnh mở tủ và kết quả xác minh:
#  - ptit/locker/open
#  - ptit/verified/#
# ESP32 xuất dữ liệu cảm biến, mã quét, phím bấm:
#  - ptit/QR_Shipper, ptit/QR_Shiper, ptit/QR_send, ptit/QR_rec
#  - ptit/rec/#
#  - ptit/cancel, ptit/locker/#
#  - ptit/chung2004/compartment/#
# ------------------------------------------------------------------------------
{allow, {client, "^(locker_.*|Smart_box.*|ESP32_.*)$"}, subscribe, [
    "ptit/locker/open",
    "ptit/verified/#"
]}.

{allow, {client, "^(locker_.*|Smart_box.*|ESP32_.*)$"}, publish, [
    "ptit/QR_Shipper",
    "ptit/QR_Shiper",
    "ptit/QR_send",
    "ptit/QR_rec",
    "ptit/rec/#",
    "ptit/cancel",
    "ptit/locker/#",
    "ptit/chung2004/compartment/#"
]}.

# ------------------------------------------------------------------------------
# 3. QUYỀN HẠN CỦA GIAO DIỆN KIỂM THỬ MQTTX (Auditor & Developer)
# Cho phép lắng nghe và phát bản tin trên không gian ptit/#
# ------------------------------------------------------------------------------
{allow, {client, "^(mqttx_.*|Smart_box.*)$"}, all, ["ptit/#"]}.

# ------------------------------------------------------------------------------
# 4. DEFAULT DENY-ALL (CHỐNG CAN THIỆP CHÉO & PHÒNG NGỪA TẤN CÔNG)
# Chặn tuyệt đối mọi nỗ lực can thiệp hoặc lắng nghe trộm giữa các trạm tủ khác nhau.
# ------------------------------------------------------------------------------
{deny, all}.
