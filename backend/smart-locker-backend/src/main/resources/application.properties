spring.application.name=smart-locker-backend
server.port=8080

# Profile mặc định khi chạy máy cá nhân (chỉ dùng khi không chỉ định SPRING_PROFILES_ACTIVE)
spring.profiles.default=local
spring.config.import=optional:application-local.properties


# Cấu hình UTF-8 toàn diện
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.messages.encoding=UTF-8

# ========================================================
# 1. KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL
# ========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_locker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
# Mật khẩu KHÔNG được có giá trị mặc định trong file này (file nằm trong git).
# Chọn 1 trong 2 cách:
#   1) Tạo `backend/smart-locker-backend/application-local.properties` (đã gitignore) chứa
#      `spring.datasource.password=<mật khẩu>` rồi chạy với `--spring.profiles.active=local`.
#   2) Đặt biến môi trường `DB_PASSWORD`.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# 2. CẤU HÌNH HIBERNATE & JPA
# ========================================================
# Dùng 'update' để Hibernate tự map với các bảng đã tạo trong DataGrip
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================================
# 3. CẤU HÌNH LOGGING
# ========================================================
logging.level.org.springframework=INFO
logging.level.com.ptit.smartlocker=INFO

# ========================================================
# 4. CẤU HÌNH JACKSON (JSON DESERIALIZATION)
# ========================================================
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.fail-on-empty-beans=false

# ========================================================
# 5. CẤU HÌNH BẢO MẬT & CORS
# ========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

# Đường lùi khẩn cấp khi demo: mặc định BẬT xác thực.
# Chỉ đặt biến môi trường SECURITY_ENABLED=false ở lần chạy cụ thể để tắt (kèm log WARN rõ ràng).
# Mọi lần dùng phải ghi DECISIONS. KHÔNG tạo profile nào đặt false.
app.security.enabled=${SECURITY_ENABLED:true}
# ========================================================
# 6. CAU HINH MQTT BROKER (LIVE HARDWARE & MQTTX BRIDGE)
# ========================================================
mqtt.broker.url=${MQTT_BROKER_URL:tcp://broker.emqx.io:1883}
mqtt.client.id=${MQTT_CLIENT_ID:smart_locker_backend_server}
mqtt.topic.base=${MQTT_TOPIC_BASE:ptit}
mqtt.enabled=${MQTT_ENABLED:true}
mqtt.connection-timeout=10
mqtt.keep-alive-interval=60

# --- T2: ánh xạ id thiết bị <-> id tủ trong CSDL ---
# Uplink do thiết bị gửi lên mang `locker_id` là id THIẾT BỊ (ví dụ `khuon_vien`),
# không phải khoá tủ `LOCKER_HN_01` mà DB dùng. Map bằng cấu hình, KHÔNG đổi schema.
# Cú pháp: danh sách `dev:DBID`, phân tách bằng dấu phẩy. Thêm tủ thật thứ 2 chỉ cần thêm 1 mục.
mqtt.locker.id.map=${MQTT_LOCKER_ID_MAP:khuon_vien:LOCKER_HN_01}
# Tủ mặc định khi payload/topic không cho biết thiết bị nào (kèm log WARN + device_events HW_MQTT_UNMAPPED).
mqtt.locker.id.default=${MQTT_LOCKER_ID_DEFAULT:LOCKER_HN_01}
# --- Nhận diện firmware cũ: topic phẳng `chung2004` không mang locker_id ---
# Firmware hiện tại publish `{base}/chung2004/compartment/N/status` (và .../event) mà payload
# KHÔNG có trường `locker_id`. Không xử lý thì mỗi ~5 giây backend ghi 1 dòng rác
# HW_MQTT_UNMAPPED (~17k dòng/ngày) và trạng thái ngăn thật không vào được CSDL.
# Đặt giá trị này = id tủ để backend hiểu "chung2004" là thiết bị của tủ đó.
# Đặt RỖNG để tắt và quay lại hành vi cũ (rơi về mqtt.locker.id.default + WARN).
mqtt.locker.prefix.chung2004=${MQTT_LOCKER_PREFIX_CHUNG2004:LOCKER_HN_01}
# Phát SONG SONG topic phẳng kiểu cũ (ptit/verified/shipper, ptit/locker/open...) bên cạnh
# kiểu mới ptit/{dev}/... . Mặc định BẬT cho demo an toàn (firmware cũ vẫn chạy được);
# đặt false khi toàn bộ firmware đã chuyển sang topic có id.
mqtt.downlink.legacy=${MQTT_DOWNLINK_LEGACY:true}

# ========================================================
# 6b. TỰ NHẢ NGĂN KHI SHIPPER ĐẶT TRƯỚC MÀ KHÔNG ĐẾN
# ========================================================
# Shipper bấm "đặt trước ngăn" trên web → ngăn bị giữ ở RESERVED. Nếu không đến nạp hàng,
# ngăn bị giữ vô thời hạn khiến khách khác không dùng được. Tác vụ nền quét mỗi 5 phút và
# nhả các ngăn đã giữ quá số phút dưới đây về EMPTY.
# Đặt 0 hoặc số âm để TẮT hoàn toàn (ngăn giữ cho tới khi shipper tự huỷ).
app.reservation.timeout-minutes=${RESERVATION_TIMEOUT_MINUTES:120}

# ========================================================
# 7. NÂNG CẤP BẢO MẬT MQTT CÔNG NGHIỆP
# ========================================================
# 1. Xác thực & Kênh truyền mã hóa TLS/MQTTS (Cổng 8883)
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.ssl.enabled=${MQTT_SSL_ENABLED:false}
mqtt.security.secret-token=${MQTT_SECRET_TOKEN:smart_locker_ptit_secret_key_2026}

# 2. Phân quyền Topic (ACL) & Chống can thiệp chéo trạm
mqtt.acl.enforce=${MQTT_ACL_ENFORCE:true}

# 3. Cơ chế Di chúc (Last Will and Testament - LWT)
mqtt.lwt.enabled=${MQTT_LWT_ENABLED:true}
mqtt.lwt.topic=${MQTT_LWT_TOPIC:ptit/backend/status}

# 4. Trạng thái giữ chậm (MQTT Retain Flag)
mqtt.retain.enabled=${MQTT_RETAIN_ENABLED:true}
