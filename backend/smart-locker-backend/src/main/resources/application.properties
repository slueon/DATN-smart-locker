spring.application.name=smart-locker-backend
server.port=8080

# ========================================================
# 1. KẾT NỐI CƠ SỞ DỮ LIỆU MYSQL
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_locker_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
# 👉 THAY BẰNG MẬT KHẨU MYSQL CỦA BẠN VÀO ĐÂY:
spring.datasource.password=200220
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# 2. CẤU HÌNH HIBERNATE & JPA
# ========================================================
# Dùng 'update' để Hibernate tự map với các bảng đã tạo trong DataGrip
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================================
# 3. CẤU HÌNH LOGGING
# ========================================================
logging.level.org.springframework=INFO
logging.level.com.ptit.smartlocker=DEBUG