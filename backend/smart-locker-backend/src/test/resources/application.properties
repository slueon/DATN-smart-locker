# =============================================================================
# CẤU HÌNH RIÊNG CHO TEST — KHÔNG BAO GIỜ TRỎ VÀO smart_locker_db
# =============================================================================
# Lý do tồn tại file này: trước đây `mvnw test` chạy thẳng vào database dùng
# chung (smart_locker_db), mỗi lần chạy lại đẩy thêm hàng trăm dòng vào
# device_events và auth_sessions. Dữ liệu demo bị trôi dần mà không ai biết.
# Từ nay test dùng database riêng `smart_locker_tester`.
#
# Chuẩn bị database test (chỉ một lần):
#   mysql -uroot -p -e "CREATE DATABASE IF NOT EXISTS smart_locker_tester CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
#
# Bảng do Hibernate tự tạo khi chạy test (ddl-auto=create-drop bên dưới), nên
# không cần nạp schema.sql vào smart_locker_tester.

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/smart_locker_tester?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:200220}

# create-drop: tạo schema mới mỗi lần chạy test, xoá khi xong.
# Nhờ vậy test luôn khởi đầu từ trạng thái trắng, không phụ thuộc dữ liệu còn sót.
# TUYỆT ĐỐI không đổi thành `update` — nếu đổi, dữ liệu test sẽ tích lại và
# các test đếm số dòng (như testIdorProtectionAndSecretsMasking) sẽ sai dần.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Tắt MQTT khi test: test không được phát lệnh thật xuống tủ phần cứng
# qua broker công cộng broker.emqx.io.
mqtt.enabled=false
mqtt.lwt.enabled=false

# Giữ bật xác thực để test kiểm được luồng token như môi trường thật.
app.security.enabled=true
